baseURL = "https://gitdiffgraph.olaru.dk/"
title = "GitDiffGraph for Rider"
locale = "en"
theme = "hextra"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[outputs]
  home = ["html", "llms"]

[params]
  description = "A Rider plugin that draws a C# code change as a graph of the types it touches and the dependencies between them, beside the Git diff."
  images = ["images/features/01-structure-dark.jpg"]
  marketplaceUrl = "https://plugins.jetbrains.com/plugin/io.github.iustin94.gitdiffgraph"
  issuesUrl = "https://github.com/iustin94/gitdiffgraf-public/issues"
  newIssueUrl = "https://github.com/iustin94/gitdiffgraf-public/issues/new"
  vendor = "Iustinian Olaru"
  vendorUrl = "https://olaru.dk/"
  vendorGitHubUrl = "https://github.com/iustin94"

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "favicon.svg"

  [params.footer]
    displayCopyright = true
    displayPoweredBy = false

  [params.page]
    width = "wide"

  [params.theme]
    default = "light"
    displayToggle = false

